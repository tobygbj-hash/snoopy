<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snoopy Summary Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">For Toby</p>
      <h1>Ask Snoopy</h1>
      <p>
        Say or type the exact words to search. Snoopy checks Google in the
        background, closes the results tab, and reads the AI Overview aloud.
      </p>
      <label class="field">
        <span>Exact Google search words</span>
        <textarea
          id="queryInput"
          rows="3"
          placeholder="Ask about space, recipes, weather, or anything else"
        ></textarea>
      </label>
      <button id="voiceSearchButton" type="button">Speak search words</button>
      <button id="searchAndReadButton" type="button" class="secondary">
        Search Google and read AI Overview
      </button>
      <hr />
      <p class="small">
        Already on a Google results page? This still works too.
      </p>
      <button id="readSummaryButton" type="button">Read summary aloud</button>
      <p id="statusText" class="status" role="status" aria-live="polite">
        Ready when you are, Toby.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
